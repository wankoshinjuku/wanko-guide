<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>くるくるわんこ ミニゲーム（スタッフ確認用）</title>
</head>
<body>
<style>
:root {
  color-scheme: light;
  --bg: #fff8f1; --panel: #ffffff; --ink: #1c1917; --muted: #6b6560; --line: #f1e4d8;
  --accent: #F97316; --accent-ink: #9a3412; --accent-soft: #fff1e6; --belt: #3f3a36; --belt2: #57504a; --bad: #b91c1c; --ok: #15803d;
}
* { box-sizing: border-box; }
html, body, button { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, textarea, select { -webkit-user-select: text; user-select: text; }
.gicon { vertical-align: middle; }
.gemoji .gicon { width: 56px; height: 56px; }
.bigemoji .gicon { width: 132px; height: 132px; }
.stamprow .gicon { width: 32px; height: 32px; vertical-align: top; margin-top: 1px; }
.dog .art { width: 1.6em; height: 1.6em; }
.dog .art + .art { display: none; }
.feedpad.open .dog .art { display: none; }
.feedpad.open .dog .art + .art { display: inline-block; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif; -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 760px; margin: 0 auto; padding: 16px 16px 40px; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.tools { display: flex; gap: 8px; }
h1 { font-size: 22px; margin: 4px 0 0; }
h2 { font-size: 18px; margin: 0 0 6px; }
.muted { color: var(--muted); margin: 0; font-size: 14px; }
.center { text-align: center; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-top: 16px; }
button { font: inherit; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent); color: #fff; padding: 8px 16px; cursor: pointer; font-weight: 700; white-space: nowrap; touch-action: manipulation; }
button.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 500; }
button.small { padding: 4px 12px; font-size: 14px; }
button.icon { padding: 8px 10px; }
button.big { font-size: 18px; padding: 12px 28px; }
button:disabled { opacity: .5; }
.row { display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.back { margin-top: 16px; }

/* 一覧 */
.shopwelcome { background: var(--accent-soft); border-color: transparent; }
.shopwelcome p { margin: 0 0 6px; font-weight: 700; }
.shopwelcome a { color: var(--accent-ink); font-weight: 700; }
.stamps { text-align: center; }
.stamprow { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; font-size: 22px; margin-bottom: 6px; }
.stamprow span { width: 34px; height: 34px; line-height: 34px; border-radius: 50%; background: var(--bg); color: var(--muted); }
.stamprow span.on { background: var(--accent-soft); }
.allstamps { font-weight: 700; color: var(--accent-ink); margin: 8px 0 0; }
.pick { margin: 16px 0 8px; }
.glist { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.gcard { display: flex; gap: 12px; align-items: flex-start; text-align: left; background: var(--panel); color: var(--ink); border: 1px solid var(--line); padding: 14px; font-weight: 400; white-space: normal; position: relative; }
.gcard:hover { border-color: var(--accent); }
.gcard.stamped::after { content: '✓'; position: absolute; top: 8px; right: 10px; color: var(--ok); font-weight: 800; }
.gemoji { font-size: 34px; line-height: 1; }
.gtext { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.gtext strong { font-size: 16px; }
.gbest { font-size: 13px; color: var(--accent-ink); font-weight: 600; }
.real { text-align: left; }
.real p { margin: 0 0 8px; }
.real a { color: var(--accent-ink); font-weight: 700; }
.bigemoji { font-size: 56px; line-height: 1.2; }

/* 遊ぶ画面の共通 */
.hud { display: flex; justify-content: space-between; font-size: 18px; gap: 12px; }
.num { font-variant-numeric: tabular-nums; font-size: 26px; }
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 8px 0 14px; }
.bar > div { height: 100%; width: 100%; background: var(--accent); transition: width .2s linear; }
.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.float { position: absolute; top: 8px; font-weight: 800; pointer-events: none; animation: up .7s ease-out forwards; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
.float.bad { color: #fecaca; }
@keyframes up { to { transform: translateY(-20px); opacity: 0; } }

/* 回転レーン */
.lane { position: relative; height: 150px; border-radius: 12px; overflow: hidden; background: var(--belt); user-select: none; touch-action: manipulation; }
.belt { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, var(--belt) 0 28px, var(--belt2) 28px 56px); animation: belt 1s linear infinite; opacity: .6; }
@keyframes belt { from { background-position: 0 0; } to { background-position: -56px 0; } }
.item { position: absolute; top: 37px; left: 0; width: 76px; height: 76px; border-radius: 50%; border: 0; padding: 0; font-size: 44px; line-height: 76px; text-align: center; background: rgba(255,255,255,.92); box-shadow: 0 2px 6px rgba(0,0,0,.25); color: inherit; will-change: transform; }
.item.tea { background: #d9f2d0; }
.item.pop { animation: pop .25s ease-out forwards; pointer-events: none; }
@keyframes pop { to { transform: scale(1.5); opacity: 0; } }

/* 落ちてくる系 */
.field { position: relative; height: 300px; border-radius: 12px; overflow: hidden; background: linear-gradient(var(--accent-soft), var(--panel)); border: 1px solid var(--line); user-select: none; touch-action: none; }
.field.tall { height: 340px; }
.drop { position: absolute; top: 0; left: 0; font-size: 36px; line-height: 1; will-change: transform; pointer-events: none; }
.catcher { position: absolute; bottom: 10px; left: 0; width: 60px; text-align: center; font-size: 48px; line-height: 1; will-change: transform; }
.cover { position: absolute; inset: 0; display: grid; place-items: center; font-size: 64px; }
.answers button { min-width: 96px; }

/* お椀タワー */
.slab { position: absolute; height: 20px; border-radius: 4px 4px 14px 14px; background: linear-gradient(#7c1f22 0 5px, #26211f 5px); box-shadow: 0 0 0 1.5px #fff; }
.slab.base { background: linear-gradient(#7c1f22 0 5px, #26211f 5px); }
.slab.move { background: linear-gradient(#c9242b 0 5px, #26211f 5px); }
.slab.perfect { background: linear-gradient(#e8b13e 0 5px, #26211f 5px); }

/* リズム */
.pad { position: relative; display: block; width: 100%; height: 260px; border-radius: 14px; background: var(--accent-soft); border: 1px solid var(--line); overflow: hidden; color: var(--ink); }
.target { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 90px; height: 90px; border-radius: 50%; border: 4px solid var(--accent); display: grid; place-items: center; font-size: 44px; background: var(--panel); }
.ring { position: absolute; left: 50%; top: 50%; width: 90px; height: 90px; border-radius: 50%; border: 4px dashed var(--accent-ink); transform: translate(-50%, -50%) scale(2.6); pointer-events: none; }
.judge { position: absolute; left: 0; right: 0; top: 18px; font-size: 22px; font-weight: 800; opacity: 0; }
.judge.ok { color: var(--ok); } .judge.bad { color: var(--bad); }
.judge.show { animation: judge .6s ease-out; }
@keyframes judge { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-14px); } }

/* 神経衰弱 */
.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.card { aspect-ratio: 1; padding: 0; border-radius: 12px; background: var(--accent); border: 0; font-size: 34px; }
.art { width: 1em; height: 1em; display: inline-block; vertical-align: -.14em; pointer-events: none; user-select: none; -webkit-user-drag: none; -webkit-touch-callout: none; }
.card .face { visibility: hidden; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
.card .art { width: 82%; height: 82%; }
p > .art { width: 1.6em; height: 1.6em; vertical-align: -.45em; margin: 0 .1em; }
.card.open, .card.got { background: var(--panel); border: 2px solid var(--accent); }
.card.open .face, .card.got .face { visibility: visible; }
.card.got { opacity: .55; }

/* 連打 */
.pile { min-height: 44px; font-size: 26px; text-align: center; line-height: 1.2; word-break: break-all; }
.mashbtn { width: 170px; height: 170px; border-radius: 50%; font-size: 80px; padding: 0; box-shadow: 0 6px 0 #c2410c; }
.mashbtn.hit { animation: press .1s; }
@keyframes press { 50% { transform: translateY(4px) scale(.96); box-shadow: 0 2px 0 #c2410c; } }

/* 色ちがい */
.oddgrid { display: grid; gap: 6px; max-width: 420px; margin: 0 auto; }
.tile { aspect-ratio: 1; padding: 0; border: 0; border-radius: 10px; }

/* 反射神経 */
.react { display: block; width: 100%; height: 240px; border-radius: 14px; font-size: 24px; white-space: normal; }
.react.wait { background: #57534e; border-color: #57534e; }
.react.go { background: var(--ok); border-color: var(--ok); font-size: 30px; }
.react.early { background: var(--bad); border-color: var(--bad); }

/* モグラ */
.holes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 420px; margin: 0 auto; }
.hole { aspect-ratio: 1; padding: 0; border-radius: 16px; background: var(--accent-soft); border: 1px solid var(--line); font-size: 40px; color: var(--ink); }
.hole.up { animation: rise .15s ease-out; background: var(--panel); border: 2px solid var(--accent); }
.hole.full { border-color: var(--bad); }
@keyframes rise { from { transform: translateY(12px); } }

/* クイズ */
.question { font-size: 19px; font-weight: 700; margin: 8px 0 12px; }
.choices { display: grid; gap: 8px; }
.choice { background: var(--panel); color: var(--ink); border: 1px solid var(--line); text-align: left; font-weight: 500; white-space: normal; padding: 12px 14px; }
.choice.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 15%, var(--panel)); }
.choice.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 15%, var(--panel)); }

/* 結果 */
.result { font-size: 20px; margin: 4px 0; }
.result .num { font-size: 48px; color: var(--accent); }
.newbest { font-weight: 800; color: var(--accent-ink); margin: 0; }
.rank { font-size: 20px; font-weight: 800; color: var(--accent-ink); margin: 4px 0 6px; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); }
@media (max-width: 480px) {
  .lane { height: 130px; } .item { top: 30px; width: 68px; height: 68px; line-height: 68px; font-size: 38px; }
  .field { height: 260px; } .field.tall { height: 300px; }
  .glist { grid-template-columns: 1fr; }
  .mashbtn { width: 150px; height: 150px; font-size: 70px; }
}

/* ポイント・特典 */
.points .ptop { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.pbal { font-size: 22px; font-weight: 800; color: var(--accent-ink); font-variant-numeric: tabular-nums; }
.strong { font-weight: 700; color: var(--ink); margin-top: 8px; }
.small { font-size: 12px; }
.rewards { list-style: none; margin: 6px 0 0; padding: 0; }
.rewards li { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.rewards li:last-child { border-bottom: 0; }
.rname { font-weight: 700; }
.rpts { color: var(--accent-ink); font-weight: 700; white-space: nowrap; }
.ptgain { font-weight: 800; color: var(--ok); margin: 4px 0; }
.ticket { border: 3px dashed var(--accent); }
.ticket.used { border-style: solid; border-color: var(--ok); }
.rbig { font-size: 28px; font-weight: 900; margin: 6px 0; }
.clock { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; margin: 8px 0; }
.stripe { height: 10px; border-radius: 99px; background: repeating-linear-gradient(90deg, var(--accent) 0 16px, var(--accent-soft) 16px 32px); animation: belt 1s linear infinite; margin: 0 auto 10px; max-width: 280px; }
.ticket input { font: inherit; font-size: 22px; text-align: center; letter-spacing: .3em; padding: 8px; border-radius: 10px; border: 1px solid var(--line); width: 180px; background: var(--panel); color: var(--ink); }
.msg { color: var(--bad); font-weight: 700; min-height: 1.4em; margin: 6px 0 0; }
.ticket input::placeholder { letter-spacing: normal; font-size: 16px; }

/* ---- 追加の10本 ---- */
.judge { min-height: 1.6em; font-weight: 800; font-size: 18px; margin: 10px 0 0; }
/* ずるずる長押し */
.gauge { position: relative; height: 34px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 16px 0 4px; }
.gzone { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--ok) 55%, transparent); border-left: 2px solid var(--ok); border-right: 2px solid var(--ok); }
.gfill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #C9A27A, var(--accent)); opacity: .85; }
/* ピタッと止めろ */
.counter { font-size: 72px; font-weight: 900; text-align: center; font-variant-numeric: tabular-nums; line-height: 1.1; color: var(--accent-ink); }
.counter.blind { color: var(--muted); letter-spacing: .1em; }
/* お椀バランス */
.field.balance { display: grid; place-items: end center; padding-bottom: 40px; }
.tray { width: 220px; border-bottom: 10px solid #8B5E3C; border-radius: 4px; transform-origin: 50% 100%; display: flex; justify-content: center; transition: transform .05s linear; }
.stack { display: flex; flex-direction: column-reverse; align-items: center; font-size: 34px; line-height: .9; }
/* わんこに あーん */
.feedpad { display: grid; place-items: center; height: 280px; }
.dog { font-size: 120px; line-height: 1; transition: transform .1s; }

.feedpad .bubble { position: absolute; top: 18px; right: 18px; background: var(--panel); border: 2px solid var(--ink); border-radius: 16px; padding: 4px 12px; font-weight: 800; }
.feedpad.open .bubble { background: #FFE14D; color: #1c1917; }
/* 仕分けダッシュ・けいさん */
.sortitem { font-size: 110px; margin: 10px 0; }
.pop { animation: pop .18s ease-out; }
@keyframes pop { from { transform: scale(.6); } to { transform: scale(1); } }
.choices.two { grid-template-columns: 1fr 1fr; }
.choices.two .choice { text-align: center; font-size: 20px; font-weight: 800; }
.mathq { font-size: 28px; }
/* おかわりの順番 */
.spads { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 360px; margin: 12px auto 0; }
.spad { aspect-ratio: 1; font-size: 48px; border: 0; border-radius: 22px; opacity: .55; transition: opacity .1s, transform .1s; }
.spad.s0 { background: #DC2626; } .spad.s1 { background: #F97316; } .spad.s2 { background: #EAB308; } .spad.s3 { background: #16A34A; }
.spad.lit { opacity: 1; transform: scale(1.06); box-shadow: 0 0 24px rgba(255,255,255,.7); }
/* ことばパズル */
.built { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; font-size: 30px; font-weight: 900; margin: 16px 0; min-height: 48px; }
.built .slot { min-width: 32px; text-align: center; border-bottom: 3px solid var(--line); }
.built.done .slot { color: var(--ok); border-color: var(--ok); }
.letters { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.letter { font-size: 24px; min-width: 52px; min-height: 52px; background: var(--panel); color: var(--ink); border: 2px solid var(--accent); }
/* どっちが多い？ */
.heaps { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.heap { min-height: 190px; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 2px; font-size: 22px; background: var(--panel); border: 2px solid var(--line); color: var(--ink); padding: 8px; white-space: normal; }
.heap.cover span { visibility: hidden; }
.heap.cover::after { content: '?'; font-size: 60px; color: var(--muted); }
/* 修正(2026-11-05): 共通の .cover / .judge と名前がぶつかっていた分を戻す */
.heap.cover { position: static; inset: auto; display: flex; align-items: center; font-size: 22px; }
.heap.cover span { display: none; }
.judge.center { position: static; opacity: 1; }
/* おはしでキャッチ */
.ctrack { position: relative; display: block; width: 100%; height: 140px; margin-top: 12px; border-radius: 14px; background: var(--belt); border: 0; overflow: hidden; padding: 0; }
.czone { position: absolute; top: 0; bottom: 0; background: rgba(255, 225, 77, .28); border-left: 3px dashed #FFE14D; border-right: 3px dashed #FFE14D; display: grid; place-items: start center; font-size: 30px; padding-top: 4px; }
.cnoodle { position: absolute; top: 50%; font-size: 52px; transform: translate(-50%, -30%); }
@media (max-width: 480px) { .counter { font-size: 56px; } .dog { font-size: 96px; } .sortitem { font-size: 90px; } }

</style>

<main class="wrap">
  <header class="top">
    <div>
      <h1 id="title"></h1>
      <p id="sub" class="muted"></p>
    </div>
    <div class="tools">
      <button id="mute" class="ghost icon" type="button"></button>
      <button id="lang" class="ghost" type="button"></button>
    </div>
  </header>
  <section id="hub"></section>
  <section id="play" hidden></section>
  <div id="toast" class="toast" role="status" hidden></div>
</main>
<script type="module">
// i18n.js

function artImg(name) {
  const el = document.createElement("img");
  el.className = "art";
  el.src = ART[name];
  el.alt = t(`art.${name}`);
  el.draggable = false;
  return el;
}
var soba = () => artImg("soba");
function gameIcon(g) {
  const el = document.createElement("img");
  el.className = "art gicon";
  el.src = ART[`icon_${g.id}`];
  el.alt = "";
  el.draggable = false;
  return el;
}
var isTextField = (el) => el && el.closest && el.closest("input, textarea, select");
