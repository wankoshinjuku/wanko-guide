<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Review Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#C8201A; --primary-dark:#9E1612; --accent:#F3B61F;
  --bg:#FFF7EC; --card:#FFFFFF; --ink:#2A1C14; --muted:#7A685B; --line:#EEDFCC;
  --chip:#FFF; --chip-on:#FFF0DF; --shadow:0 6px 20px rgba(120,60,20,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","PingFang SC","Apple SD Gothic Neo",sans-serif;font-size:16px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:540px;margin:0 auto;padding:0 16px 120px}

/* header */
.top{background:var(--primary);color:#fff;padding:14px 16px 46px;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-40px;height:80px;background:var(--bg);border-radius:50% 50% 0 0}
.top-in{max-width:540px;margin:0 auto;position:relative;z-index:1}
.langs{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.langs button{border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:99px;padding:3px 10px;font-size:12px}
.langs button.on{background:#fff;color:var(--primary);border-color:#fff;font-weight:700}
.brand{display:flex;flex-direction:column;align-items:center;margin-top:12px;text-align:center}
.logo{background:#fff;border-radius:18px;padding:10px 18px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.logo img{display:block;height:46px;width:auto}
.brand h1{font-size:19px;margin:12px 0 2px;font-weight:800;letter-spacing:.02em}
.brand p{margin:0;font-size:13px;opacity:.9}

/* steps */
.steps{display:flex;gap:6px;margin:-26px 0 16px;position:relative;z-index:2}
.steps div{flex:1;background:#fff;border-radius:12px;padding:8px 4px;text-align:center;font-size:12px;color:var(--muted);box-shadow:var(--shadow)}
.steps b{display:block;font-size:15px;color:var(--line)}
.steps .on{color:var(--ink);font-weight:700}.steps .on b{color:var(--primary)}
.steps .done b{color:var(--accent)}

.card{background:var(--card);border-radius:20px;padding:18px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:16px;margin:0 0 2px;font-weight:800}
.card .sub{font-size:12.5px;color:var(--muted);margin:0 0 12px}

/* stars */
.stars{display:flex;justify-content:center;gap:6px}
.stars button{border:0;background:none;padding:2px;font-size:42px;line-height:1;color:#E6D8C6;transition:transform .12s}
.stars button.on{color:var(--accent)}
.stars button:active{transform:scale(1.2)}
.rate-label{text-align:center;font-weight:700;min-height:24px;margin-top:6px;color:var(--primary)}

/* counter */
.counter{display:flex;align-items:center;justify-content:center;gap:14px}
.counter .pm{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:24px;font-weight:800;color:var(--primary)}
.counter .num{min-width:120px;text-align:center}
.counter .num input{width:110px;border:0;border-bottom:2px dashed var(--line);font:inherit;font-size:40px;font-weight:800;text-align:center;color:var(--ink);background:transparent;padding:0}
.counter .num span{font-size:14px;color:var(--muted)}
.bowls{display:flex;flex-direction:column-reverse;align-items:center;height:72px;justify-content:flex-start;gap:0}
.bowl{width:34px;height:7px;background:var(--primary);border-radius:0 0 18px 18px;margin-top:-1px;box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.bowl:nth-child(even){background:var(--primary-dark)}
.quick{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.quick button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 12px;font-size:13px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--chip);border-radius:14px;padding:8px 12px;font-size:14px;text-align:left;transition:all .12s}
.chip.on{background:var(--chip-on);border-color:var(--primary);color:var(--primary-dark);font-weight:700}
.chip.on::after{content:"✓";font-weight:800}
.chips.big .chip{flex:1 1 calc(50% - 8px);padding:12px}
.cat{margin-top:14px}
.cat h3{font-size:13px;color:var(--muted);margin:0 0 6px;font-weight:700}
details summary{list-style:none;cursor:pointer;font-weight:700;color:var(--primary);font-size:14px;padding:4px 0}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"＋ "}
details[open] summary::before{content:"− "}
.honest .chip.on{border-color:#6B7A8F;background:#EEF2F7;color:#33415A}

textarea{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:15px;resize:vertical;background:#FFFCF7;color:var(--ink)}
textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.count{text-align:right;font-size:12px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>label{flex:1 1 200px;font-size:13px;color:var(--muted);font-weight:700}
select{width:100%;margin-top:4px;border:1.5px solid var(--line);border-radius:12px;padding:10px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}

/* buttons */
.cta{display:block;width:100%;border:0;border-radius:16px;padding:16px;font-size:17px;font-weight:800;background:var(--primary);color:#fff;box-shadow:0 6px 0 var(--primary-dark);transition:transform .08s}
.cta:active{transform:translateY(3px);box-shadow:0 3px 0 var(--primary-dark)}
.cta:disabled{background:#D9CBBB;box-shadow:0 6px 0 #C2B19E;cursor:not-allowed}
.ghost{display:block;width:100%;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px;font-weight:700;font-size:15px;margin-top:10px}
.hint{text-align:center;font-size:12.5px;color:var(--muted);margin:8px 0 0}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.bar .in{max-width:508px;margin:0 auto}

/* draft */
.title-in{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-weight:700;background:#FFFCF7;margin-bottom:8px;color:var(--ink)}
.small-label{font-size:12px;color:var(--muted);font-weight:700;margin:0 0 4px}
.loading{text-align:center;padding:36px 0}
.spin{display:inline-block;font-size:44px;animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.note{background:#FFF3D6;border-radius:12px;padding:10px 12px;font-size:12.5px;color:#6A4B10;margin-top:10px}

/* platforms */
.plats{display:grid;gap:10px}
.plat{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:16px;padding:14px;background:#fff;text-align:left}
.plat.on{border-color:var(--primary);background:var(--chip-on)}
.plat .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff;flex:none}
.plat .ic.g{background:#fff;border:1px solid var(--line);color:#4285F4}
.plat .ic.t{background:#34E0A1;color:#000}
.plat b{display:block}
.plat small{color:var(--muted)}
.howto{font-size:13px;color:var(--muted);padding-left:18px;margin:12px 0 0}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-120px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;transition:transform .25s;z-index:20;max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.foot{text-align:center;font-size:11.5px;color:var(--muted);margin-top:18px;padding:0 8px}
.direct{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.direct a{font-size:12px;color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="langs" id="langs"></div>
    <div class="brand">
      <div class="logo"><img id="logo" alt=""></div>
      <h1 id="storeName"></h1>
      <p data-t="tagline"></p>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="steps" id="steps">
    <div data-s="1"><b>1</b><span data-t="s1"></span></div>
    <div data-s="2"><b>2</b><span data-t="s2"></span></div>
    <div data-s="3"><b>3</b><span data-t="s3"></span></div>
  </div>

  <!-- STEP 1 -->
  <section id="step1">
    <div class="card">
      <h2 data-t="rateQ"></h2>
      <p class="sub" data-t="rateSub"></p>
      <div class="stars" id="stars"></div>
      <div class="rate-label" id="rateLabel"></div>
    </div>

    <div class="card" id="counterCard">
      <h2 id="counterTitle"></h2>
      <p class="sub" data-t="optional"></p>
      <div class="counter">
        <button class="pm" id="minus" aria-label="-">−</button>
        <div class="num"><input id="bowlsIn" type="number" inputmode="numeric" min="0"><br><span id="unit"></span></div>
        <button class="pm" id="plus" aria-label="+">＋</button>
        <div class="bowls" id="bowlStack" aria-hidden="true"></div>
      </div>
      <div class="quick" id="quick"></div>
    </div>

    <div class="card">
      <h2 data-t="whoQ"></h2>
      <p class="sub" data-t="optional"></p>
      <div class="chips" id="who"></div>
    </div>

    <div class="card">
      <h2 data-t="hiQ"></h2>
      <p class="sub" data-t="hiSub"></p>
      <div class="chips big" id="highlights"></div>
      <details id="moreBox">
        <summary data-t="more"></summary>
        <div id="cats"></div>
      </details>
    </div>

    <div class="card honest">
      <h2 id="honestTitle"></h2>
      <p class="sub" data-t="honestSub"></p>
      <div class="chips" id="honest"></div>
    </div>

    <div class="card">
      <h2 data-t="commentQ"></h2>
      <p class="sub" data-t="commentSub"></p>
      <textarea id="comment" rows="3" maxlength="300"></textarea>
      <div class="count"><span id="cCount">0</span>/300</div>
      <div class="row" style="margin-top:8px">
        <label><span data-t="outLang"></span><select id="outLang"></select></label>
        <label><span data-t="tone"></span><select id="tone"></select></label>
      </div>
    </div>
    <div class="direct"><a href="#" id="skipAi" data-t="skipAi"></a></div>
  </section>

  <!-- STEP 2 -->
  <section id="step2" hidden>
    <div class="card" id="loadingCard">
      <div class="loading"><div class="spin">🍜</div><p data-t="loading"></p></div>
    </div>
    <div class="card" id="draftCard" hidden>
      <h2 data-t="draftH"></h2>
      <p class="sub" data-t="draftSub"></p>
      <p class="small-label" data-t="titleLabel"></p>
      <input class="title-in" id="draftTitle" maxlength="120">
      <p class="small-label" data-t="bodyLabel"></p>
      <textarea id="draft" rows="9"></textarea>
      <div class="count"><span id="dCount">0</span></div>
      <div class="note" id="fallbackNote" hidden data-t="fallback"></div>
      <button class="ghost" id="regen" data-t="regen"></button>
      <button class="ghost" id="altPlat"></button>
      <button class="ghost" id="back1" data-t="back"></button>
    </div>
  </section>

  <!-- STEP 3 -->
  <section id="step3" hidden>
    <div class="card">
      <h2 data-t="platQ"></h2>
      <p class="sub" data-t="platSub"></p>
      <ol class="howto" id="howto"></ol>
      <button class="ghost" id="copyTitle" hidden data-t="copyTitle"></button>
      <button class="ghost" id="switchPlat"></button>
      <button class="ghost" id="back2" data-t="back2"></button>
    </div>
  </section>

  <p class="foot" data-t="foot"></p>
</div>

<div class="bar"><div class="in"><button class="cta" id="cta"></button></div></div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
// ---------- 店舗設定の読み込み（?store=xxx） ----------
(function(){
  var id = (new URLSearchParams(location.search).get('store') || 'kurukuru').replace(/[^a-z0-9_-]/gi,'');
  document.write('<script src="stores/' + id + '.js"><\/script>');
})();
</script>

 ko:{tagline:'오늘의 체험을 리뷰로 쓰는 것을 도와드려요',s1:'체험 선택',s2:'초안 확인',s3:'게시',

  foot:'이 도구는 고객님이 고른 내용과 직접 쓴 말을 바탕으로 문장 정리를 도울 뿐이며, 자동으로 게시하지 않습니다. 게시 전에 꼭 내용을 확인해 주세요.'}

var S = window.STORE;
var st = { ui:'ja', out:'ja', rating:0, bowls:0, who:'', sel:{}, honest:{}, tone:'casual', step:1, plat:'tripadvisor', variant:0, title:'', body:'', fallback:false };
var PNAME = { tripadvisor:'Tripadvisor', google:'Google' };
function otherPlat(){ return st.plat==='tripadvisor' ? 'google' : 'tripadvisor'; }
var $ = function(id){ return document.getElementById(id); };
function t(k){ return T[st.ui][k]; }
function L(obj){ return obj[st.ui] || obj.en || obj.ja; }

function detectLang(){
  var q = new URLSearchParams(location.search).get('lang');
  if (q && T[q]) return q;
  var n = (navigator.language || 'ja').toLowerCase();
  if (n.indexOf('ja')===0) return 'ja';
  if (n.indexOf('ko')===0) return 'ko';
  if (n.indexOf('zh')===0) return /tw|hk|mo|hant/.test(n) ? 'tw' : 'zh';
  return 'en';
}

// ---------- 描画 ----------
function chip(item, on, onTap){
  var b = document.createElement('button');
  b.className = 'chip' + (on ? ' on' : '');
  b.innerHTML = '<span>' + item.emoji + '</span><span></span>';
  b.lastChild.textContent = L(item.label);
  b.onclick = onTap;
  return b;
}
function renderChips(){
  var hl = $('highlights'); hl.innerHTML='';
  S.highlights.forEach(function(it){ hl.appendChild(chip(it, st.sel[it.id], function(){ toggle(st.sel,it.id); })); });
  var cats = $('cats'); cats.innerHTML='';
  S.categories.forEach(function(c){
    var d = document.createElement('div'); d.className='cat';
    var h = document.createElement('h3'); h.textContent = L(c.title); d.appendChild(h);
    var w = document.createElement('div'); w.className='chips';
    c.items.forEach(function(it){ w.appendChild(chip(it, st.sel[it.id], function(){ toggle(st.sel,it.id); })); });
    d.appendChild(w); cats.appendChild(d);
  });
  var ho = $('honest'); ho.innerHTML='';
  S.honest.items.forEach(function(it){ ho.appendChild(chip(it, st.honest[it.id], function(){ toggle(st.honest,it.id); })); });
  var who = $('who'); who.innerHTML='';
  ['solo','friends','family','couple','work'].forEach(function(k){
    who.appendChild(chip({emoji:{solo:'🙋',friends:'👫',family:'👨‍👩‍👧',couple:'💑',work:'💼'}[k],label:{ja:T.ja.who[k],en:T.en.who[k],zh:T.zh.who[k],tw:T.tw.who[k],ko:T.ko.who[k]}}, st.who===k, function(){ st.who = st.who===k ? '' : k; renderChips(); }));
  });
}
function toggle(map,id){ if(map[id]) delete map[id]; else map[id]=1; renderChips(); updateCta(); }

function renderStars(){
  var w = $('stars'); w.innerHTML='';
  for (var i=1;i<=5;i++){ (function(n){
    var b=document.createElement('button'); b.textContent='★'; b.setAttribute('aria-label', n+' star');
    if (n<=st.rating) b.className='on';
    b.onclick=function(){ st.rating=n; renderStars(); updateCta(); };
    w.appendChild(b);
  })(i); }
  $('rateLabel').textContent = st.rating ? t('rates')[st.rating] : '';
}

function renderBowls(){
  $('bowlsIn').value = st.bowls || '';
  $('bowlsIn').placeholder = '0';
  var n = Math.min(10, Math.ceil(st.bowls/10)), s='';
  for (var i=0;i<n;i++) s+='<div class="bowl"></div>';
  $('bowlStack').innerHTML = s;
}

function renderStatic(){
  document.documentElement.lang = {ja:'ja',en:'en',zh:'zh-Hans',tw:'zh-Hant',ko:'ko'}[st.ui];
  document.title = L(S.name) + ' | Review';
  $('storeName').textContent = L(S.name);
  [].forEach.call(document.querySelectorAll('[data-t]'), function(el){ var v=t(el.getAttribute('data-t')); if (typeof v==='string') el.textContent=v; });
  $('honestTitle').textContent = L(S.honest.title);
  if (S.counter && S.counter.enabled){
    $('counterTitle').textContent = L(S.counter.title); $('unit').textContent = L(S.counter.unit);
    var q=$('quick'); q.innerHTML='';
    S.counter.quick.forEach(function(v){ var b=document.createElement('button'); b.textContent=v+L(S.counter.unit).replace(/^(bowls)$/,' $1'); b.onclick=function(){ st.bowls=v; renderBowls(); }; q.appendChild(b); });
  } else $('counterCard').hidden = true;
  var lg=$('langs'); lg.innerHTML='';
  UI_LANGS.forEach(function(l){ var b=document.createElement('button'); b.textContent=l[1]; if(l[0]===st.ui) b.className='on'; b.onclick=function(){ setUi(l[0]); }; lg.appendChild(b); });
  var o=$('outLang'); o.innerHTML='';
  OUT_LANGS.forEach(function(l){ var op=document.createElement('option'); op.value=l[0]; op.textContent=l[1]; o.appendChild(op); }); o.value=st.out;
  var tn=$('tone'); tn.innerHTML='';
  ['casual','polite','short'].forEach(function(k){ var op=document.createElement('option'); op.value=k; op.textContent=t('tones')[k]; tn.appendChild(op); }); tn.value=st.tone;
  renderStars(); renderChips(); renderBowls(); renderHowto(); updateCta();
}
function setUi(l){ st.ui=l; st.out=l; renderStatic(); }

function renderHowto(){
  var h=$('howto'); h.innerHTML='';
  (st.plat==='google'?t('howG'):t('howT')).forEach(function(s){ var li=document.createElement('li'); li.textContent=s; h.appendChild(li); });
  $('copyTitle').hidden = st.plat!=='tripadvisor';
  // 既定の投稿先（Tripadvisor）以外は控えめなボタンで選べるようにする
  var alt = otherPlat()==='google' ? t('alt') : t('altT');
  $('altPlat').textContent = alt; $('switchPlat').textContent = alt;
}

function go(step){
  st.step=step;
  [1,2,3].forEach(function(i){ $('step'+i).hidden = i!==step; });
  [].forEach.call(document.querySelectorAll('#steps div'), function(d){ var s=+d.getAttribute('data-s'); d.className = s===step?'on':(s<step?'done':''); });
  updateCta(); window.scrollTo({top:0,behavior:'smooth'});
}

function updateCta(){
  var c=$('cta'); c.disabled=false; c.hidden=false;
  if (st.step===1){ c.textContent = st.rating ? t('next1') : t('needRate'); c.disabled = !st.rating; }
  else if (st.step===2){ c.textContent=t('next2').replace('{p}',PNAME[st.plat]); c.disabled = $('draftCard').hidden || !$('draft').value.trim(); }
  else c.textContent=t('next3').replace('{p}',PNAME[st.plat]);
}

// ---------- 文案生成 ----------
function labelsEn(map, list){ return list.filter(function(it){ return map[it.id]; }).map(function(it){ return it.label.en; }); }
function allItems(){ var a=S.highlights.slice(); S.categories.forEach(function(c){ a=a.concat(c.items); }); return a; }

function generate(){
  go(2);
  $('loadingCard').hidden=false; $('draftCard').hidden=true; updateCta();
  st.variant++;
  var payload = {
    api:'generate', store:S.id, lang:st.out, tone:st.tone, rating:st.rating,
    bowls: (S.counter&&S.counter.enabled&&st.bowls)? st.bowls : '',
    who: st.who, likes: JSON.stringify(labelsEn(st.sel, allItems())),
    dislikes: JSON.stringify(labelsEn(st.honest, S.honest.items)),
    comment: $('comment').value.trim().slice(0,300), v: st.variant
  };
  var done = function(title, body, fb){
    st.fallback=!!fb; $('fallbackNote').hidden=!fb;
    $('draftTitle').value=title||''; $('draft').value=body||'';
    $('loadingCard').hidden=true; $('draftCard').hidden=false; countDraft(); updateCta();
  };
  if (!window.API_URL){ done('','',true); return; }
  jsonp(payload, 70000).then(function(r){
    if (r && r.ok && r.review) done(r.title, r.review, false);
    else done('','',true);
  }).catch(function(){ done('','',true); });
}

function jsonp(params, ms){
  return new Promise(function(resolve, reject){
    var cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*1e5), s=document.createElement('script');
    var timer=setTimeout(function(){ cleanup(); reject(new Error('timeout')); }, ms||20000);
    function cleanup(){ try{ delete window[cb]; }catch(e){ window[cb]=undefined; } if(s.parentNode) s.parentNode.removeChild(s); clearTimeout(timer); }
    window[cb]=function(d){ cleanup(); resolve(d); };
    s.src = window.API_URL+'?'+Object.keys(params).map(function(k){ return encodeURIComponent(k)+'='+encodeURIComponent(params[k]); }).join('&')+'&callback='+cb;
    s.onerror=function(){ cleanup(); reject(new Error('network')); };
    document.body.appendChild(s);
  });
}

function countDraft(){ $('dCount').textContent = $('draft').value.length; }

// ---------- コピー＆投稿 ----------
function copyText(txt){
  if (navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(txt).catch(function(){ legacyCopy(txt); }); }
  else legacyCopy(txt);
}
function legacyCopy(txt){
  var ta=document.createElement('textarea'); ta.value=txt; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length); try{ document.execCommand('copy'); }catch(e){} document.body.removeChild(ta);
}
function toast(msg){ var e=$('toast'); e.textContent=msg; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(function(){ e.classList.remove('show'); }, 2600); }

// ---------- イベント ----------
$('cta').onclick = function(){
  if (st.step===1) generate();
  else post(st.plat);
};
// 本文をコピーして投稿画面を開き、仕上げの手順画面へ
function post(plat){
  st.plat = plat;
  copyText($('draft').value);
  toast(t('copied'));
  window.open(S.links[plat], '_blank', 'noopener');
  renderHowto(); go(3);
}
$('altPlat').onclick=function(){ post(otherPlat()); };
$('switchPlat').onclick=function(){ post(otherPlat()); };
$('minus').onclick=function(){ st.bowls=Math.max(0,(st.bowls||0)-5); renderBowls(); };
$('plus').onclick=function(){ st.bowls=Math.min(S.counter.max,(st.bowls||0)+5); renderBowls(); };
$('bowlsIn').oninput=function(){ var v=parseInt(this.value,10); st.bowls=isNaN(v)?0:Math.max(0,Math.min(S.counter.max,v)); var n=Math.min(10,Math.ceil(st.bowls/10)),s=''; for(var i=0;i<n;i++) s+='<div class="bowl"></div>'; $('bowlStack').innerHTML=s; };
$('comment').oninput=function(){ $('cCount').textContent=this.value.length; };
$('outLang').onchange=function(){ st.out=this.value; };
$('tone').onchange=function(){ st.tone=this.value; };
$('draft').oninput=function(){ countDraft(); updateCta(); };
$('regen').onclick=generate;
$('back1').onclick=function(){ go(1); };
$('back2').onclick=function(){ go(2); };
$('skipAi').onclick=function(e){ e.preventDefault(); go(2); $('loadingCard').hidden=true; $('draftCard').hidden=false; $('fallbackNote').hidden=true; $('draftTitle').value=''; $('draft').value=''; countDraft(); updateCta(); $('draft').focus(); };
$('copyTitle').onclick=function(){ copyText($('draftTitle').value); toast(t('titleCopied')); };


// ---------- 起動 ----------
(function init(){
  var r=document.documentElement.style;
  r.setProperty('--primary', S.theme.primary); r.setProperty('--primary-dark', S.theme.primaryDark); r.setProperty('--accent', S.theme.accent);
  $('logo').src = S.logo; $('logo').alt = S.name.en;
  st.ui = detectLang(); st.out = st.ui; st.plat = S.defaultPlatform || 'tripadvisor';
  renderStatic(); go(1);
})();
</script>
