<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ミニゲームの記録を消す</title>
<style>
body{margin:0;font-family:-apple-system,"Hiragino Sans",sans-serif;background:#FFF6EA;color:#1A1A1A;padding:32px 20px;text-align:center}
.box{max-width:420px;margin:0 auto;background:#fff;border:3px solid #F26A1B;border-radius:20px;padding:28px 20px}
h1{font-size:20px;margin:0 0 16px}
p{font-size:16px;line-height:1.7;margin:8px 0}
b{font-size:28px;color:#C2410C}
</style>
</head>
<body>
<div class="box">
<h1>ミニゲームの記録を消す</h1>
<div id="out"><p>消しています…</p></div>
</div>
<script>
// 11/08 ごろうさんの端末の記録を消すための一時ページ。この端末・このブラウザの中のミニゲームの記録（kwam.・kwdemo.）だけを消す。使い終わったら削除する
(function(){
  var out=document.getElementById('out'), n=0;
  try{
    var ks=[];
    for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i); if(k&&(k.indexOf('kwam.')===0||k.indexOf('kwdemo.')===0)) ks.push(k);}
    ks.forEach(function(k){localStorage.removeItem(k);n++;});
    var left=0; for(var j=0;j<localStorage.length;j++){var k2=localStorage.key(j); if(k2&&(k2.indexOf('kwam.')===0||k2.indexOf('kwdemo.')===0)) left++;}
    out.innerHTML='<p>このスマホ（このアプリの中）のミニゲームの記録を消しました。</p><p>消した数 <b>'+n+'</b></p>'+(left?'<p>消しきれなかったものが '+left+' 件あります。</p>':'<p>残りはありません。</p>');
  }catch(e){ out.innerHTML='<p>このブラウザでは消せませんでした。</p>'; }
})();
</script>
</body>
</html>
