<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Review Helper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#C8201A; --primary-dark:#9E1612; --accent:#F3B61F;
  --bg:#FFF7EC; --card:#FFFFFF; --ink:#2A1C14; --muted:#7A685B; --line:#EEDFCC;
  --soft:#FFF0DF; --shadow:0 6px 20px rgba(120,60,20,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","PingFang SC","Apple SD Gothic Neo",sans-serif;font-size:16px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:540px;margin:0 auto;padding:0 16px 120px}

.top{background:var(--primary);color:#fff;padding:14px 16px 46px;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-40px;height:80px;background:var(--bg);border-radius:50% 50% 0 0}
.top-in{max-width:540px;margin:0 auto;position:relative;z-index:1}
.langs{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.langs button{border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:99px;padding:3px 10px;font-size:12px}
.langs button.on{background:#fff;color:var(--primary);border-color:#fff;font-weight:700}
.brand{display:flex;flex-direction:column;align-items:center;margin-top:12px;text-align:center}
.logo{background:#fff;border-radius:18px;padding:10px 18px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.logo img{display:block;height:46px;width:auto}
.brand h1{font-size:19px;margin:12px 0 2px;font-weight:800}
.brand p{margin:0;font-size:13px;opacity:.92}

.steps{display:flex;gap:6px;margin:-26px 0 16px;position:relative;z-index:2}
.steps div{flex:1;background:#fff;border-radius:12px;padding:8px 4px;text-align:center;font-size:12px;color:var(--muted);box-shadow:var(--shadow)}
.steps b{display:block;font-size:15px;color:var(--line)}
.steps .on{color:var(--ink);font-weight:700}.steps .on b{color:var(--primary)}
.steps .done b{color:var(--accent)}

.card{background:var(--card);border-radius:20px;padding:18px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:16px;margin:0 0 4px;font-weight:800}
.card .sub{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.intro{background:var(--soft);border-radius:16px;padding:12px 14px;font-size:13.5px;margin-bottom:14px}
.intro p{margin:0 0 4px}.intro p:last-child{margin:0}

.q{margin-bottom:18px}
.q:last-child{margin-bottom:0}
.q label{display:flex;gap:8px;align-items:flex-start;font-weight:700;font-size:15px;margin-bottom:6px}
textarea,input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;font:inherit;font-size:16px;resize:vertical;background:#FFFCF7;color:var(--ink)}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px}

.meter{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-top:6px}
.meter .bar{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.meter.ok .bar i{background:#2E9E5B}

.cta{display:block;width:100%;border:0;border-radius:16px;padding:16px;font-size:17px;font-weight:800;background:var(--primary);color:#fff;box-shadow:0 6px 0 var(--primary-dark);transition:transform .08s}
.cta:active{transform:translateY(3px);box-shadow:0 3px 0 var(--primary-dark)}
.cta:disabled{background:#D9CBBB;box-shadow:0 6px 0 #C2B19E;cursor:not-allowed}
.ghost{display:block;width:100%;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px;font-weight:700;font-size:15px;margin-top:10px}
.bar-fixed{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.bar-fixed .in{max-width:508px;margin:0 auto}
.small-label{font-size:12px;color:var(--muted);font-weight:700;margin:0 0 4px}
.howto{font-size:13.5px;padding-left:20px;margin:6px 0 0}
.howto li{margin-bottom:4px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-120px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;transition:transform .25s;z-index:20;max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.foot{text-align:center;font-size:11.5px;color:var(--muted);margin-top:18px;padding:0 8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="langs" id="langs"></div>
    <div class="brand">
      <div class="logo"><img id="logo" alt=""></div>
      <h1 id="storeName"></h1>
      <p data-t="tagline"></p>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="steps" id="steps">
    <div data-s="1"><b>1</b><span data-t="s1"></span></div>
    <div data-s="2"><b>2</b><span data-t="s2"></span></div>
    <div data-s="3"><b>3</b><span data-t="s3"></span></div>
  </div>

  <!-- STEP 1：質問に答える -->
  <section id="step1">
    <div class="intro">
      <p data-t="intro1"></p>
      <p data-t="intro2"></p>
      <p data-t="intro3"></p>
    </div>
    <div class="card" id="questions"></div>
    <div class="card">
      <div class="q">
        <label><span>✏️</span><span id="titleQ"></span></label>
        <input type="text" id="titleIn" maxlength="120">
      </div>
    </div>
  </section>

  <!-- STEP 2：確認・手直し -->
  <section id="step2" hidden>
    <div class="card">
      <h2 data-t="checkH"></h2>
      <p class="sub" data-t="checkSub"></p>
      <p class="small-label" data-t="titleLabel"></p>
      <input type="text" id="title2" maxlength="120">
      <p class="small-label" style="margin-top:10px" data-t="bodyLabel"></p>
      <textarea id="body" rows="10"></textarea>
      <div class="meter" id="meter"><span id="len">0</span><div class="bar"><i id="barFill"></i></div><span data-t="meterHint"></span></div>
      <button class="ghost" id="altPlat"></button>
      <button class="ghost" id="back1" data-t="back"></button>
    </div>
  </section>

  <!-- STEP 3：仕上げ -->
  <section id="step3" hidden>
    <div class="card">
      <h2 data-t="doneH"></h2>
      <p class="sub" data-t="doneSub"></p>
      <ol class="howto" id="howto"></ol>
      <button class="ghost" id="copyTitle" data-t="copyTitle"></button>
      <button class="ghost" id="switchPlat"></button>
      <button class="ghost" id="back2" data-t="back2"></button>
    </div>
  </section>

  <p class="foot" data-t="foot"></p>
</div>

<div class="bar-fixed"><div class="in"><button class="cta" id="cta"></button></div></div>
<div class="toast" id="toast"></div>

<script>

(function(){
  var id = (new URLSearchParams(location.search).get('store') || 'kurukuru').replace(/[^a-z0-9_-]/gi,'');
  document.write('<script src="stores/' + id + '.js"><\/script>');
})();
</script>

var S = window.STORE;
var PNAME = { tripadvisor:'Tripadvisor', google:'Google' };
var st = { ui:'ja', step:1, plat:'tripadvisor', ans:{}, title:'' };
var $ = function(id){ return document.getElementById(id); };
function t(k){ return T[st.ui][k]; }
function L(o){ return o[st.ui] || o.en || o.ja; }
function otherPlat(){ return st.plat==='tripadvisor' ? 'google' : 'tripadvisor'; }

// 書きかけの保存（この端末のブラウザだけ。投稿画面から戻ってきても消えないように）
var KEY = 'review-helper-' + S.id;
function saveDraft(){ try{ localStorage.setItem(KEY, JSON.stringify({ ans:st.ans, title:st.title, body:$('body').value, t:Date.now() })); }catch(e){} }
function loadDraft(){
  try{
    var d = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (d && Date.now() - d.t < 6*3600*1000){ st.ans = d.ans || {}; st.title = d.title || ''; return d; }
  }catch(e){}
  return null;
}

function detectLang(){
  var q = new URLSearchParams(location.search).get('lang');
  if (q && T[q]) return q;
  var n = (navigator.language || 'ja').toLowerCase();
  if (n.indexOf('ja')===0) return 'ja';
  if (n.indexOf('ko')===0) return 'ko';
  if (n.indexOf('zh')===0) return /tw|hk|mo|hant/.test(n) ? 'tw' : 'zh';
  return 'en';
}

function renderQuestions(){
  var box = $('questions'); box.innerHTML = '';
  S.questions.forEach(function(q){
    var d = document.createElement('div'); d.className = 'q';
    var lb = document.createElement('label'); lb.setAttribute('for', 'q_'+q.id);
    lb.innerHTML = '<span></span><span></span>'; lb.firstChild.textContent = q.emoji; lb.lastChild.textContent = L(q.q);
    var ta = document.createElement('textarea'); ta.id = 'q_'+q.id; ta.rows = 2; ta.maxLength = 1000;
    ta.value = st.ans[q.id] || '';
    ta.oninput = function(){ st.ans[q.id] = ta.value; saveDraft(); updateCta(); };
    d.appendChild(lb); d.appendChild(ta); box.appendChild(d);
  });
  $('titleQ').textContent = L(S.titleQ);
  $('titleIn').value = st.title;
}

function renderStatic(){
  document.documentElement.lang = {ja:'ja',en:'en',zh:'zh-Hans',tw:'zh-Hant',ko:'ko'}[st.ui];
  document.title = L(S.name) + ' | Review';
  $('storeName').textContent = L(S.name);
  [].forEach.call(document.querySelectorAll('[data-t]'), function(el){ var v=t(el.getAttribute('data-t')); if (typeof v==='string') el.textContent=v; });
  var lg=$('langs'); lg.innerHTML='';
  UI_LANGS.forEach(function(l){ var b=document.createElement('button'); b.textContent=l[1]; if(l[0]===st.ui) b.className='on'; b.onclick=function(){ st.ui=l[0]; renderStatic(); }; lg.appendChild(b); });
  renderQuestions(); renderHowto(); updateCta();
}

function renderHowto(){
  var h=$('howto'); h.innerHTML='';
  (st.plat==='google'?t('howG'):t('howT')).forEach(function(s){ var li=document.createElement('li'); li.textContent=s; h.appendChild(li); });
  $('copyTitle').hidden = st.plat!=='tripadvisor';
  var alt = otherPlat()==='google' ? t('alt') : t('altT');
  $('altPlat').textContent = alt; $('switchPlat').textContent = alt;
}

function anyAnswer(){ return S.questions.some(function(q){ return (st.ans[q.id]||'').trim(); }); }

function go(step){
  st.step=step;
  [1,2,3].forEach(function(i){ $('step'+i).hidden = i!==step; });
  [].forEach.call(document.querySelectorAll('#steps div'), function(d){ var s=+d.getAttribute('data-s'); d.className = s===step?'on':(s<step?'done':''); });
  updateCta(); window.scrollTo({top:0,behavior:'smooth'});
}

function updateCta(){
  var c=$('cta');
  if (st.step===1){ c.disabled = !anyAnswer(); c.textContent = c.disabled ? t('needOne') : t('next1'); }
  else if (st.step===2){ c.disabled = !$('body').value.trim(); c.textContent = t('next2').replace('{p}', PNAME[st.plat]); }
  else { c.disabled = false; c.textContent = t('next3').replace('{p}', PNAME[st.plat]); }
}

// 答えを質問の順に段落として並べるだけ（言葉を足さない・変えない）
function compose(){
  return S.questions.map(function(q){ return (st.ans[q.id]||'').trim(); }).filter(Boolean).join('\n\n');
}

function updateMeter(){
  var n = $('body').value.length;
  $('len').textContent = n;
  $('barFill').style.width = Math.min(100, n / MIN_LEN * 100) + '%';
  $('meter').classList.toggle('ok', n >= MIN_LEN);
}

function copyText(txt){
  if (navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(txt).catch(function(){ legacyCopy(txt); }); }
  else legacyCopy(txt);
}
function legacyCopy(txt){
  var ta=document.createElement('textarea'); ta.value=txt; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length); try{ document.execCommand('copy'); }catch(e){} document.body.removeChild(ta);
}
function toast(msg){ var e=$('toast'); e.textContent=msg; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(function(){ e.classList.remove('show'); }, 2600); }

// 本文をコピーして投稿画面を開き、仕上げの手順画面へ
function post(plat){
  st.plat = plat;
  copyText($('body').value);
  toast(t('copied'));
  window.open(S.links[plat], '_blank', 'noopener');
  renderHowto(); go(3);
}

$('cta').onclick = function(){
  if (st.step===1){
    $('body').value = compose();
    $('title2').value = st.title;
    updateMeter(); saveDraft(); go(2);
  }
  else post(st.plat);
};
$('titleIn').oninput = function(){ st.title = this.value; saveDraft(); };
$('title2').oninput = function(){ st.title = this.value; $('titleIn').value = this.value; saveDraft(); };
$('body').oninput = function(){ updateMeter(); saveDraft(); updateCta(); };
$('altPlat').onclick = function(){ post(otherPlat()); };
$('switchPlat').onclick = function(){ post(otherPlat()); };
$('back1').onclick = function(){ go(1); };
$('back2').onclick = function(){ go(2); };
$('copyTitle').onclick = function(){ copyText($('title2').value); toast(t('titleCopied')); };

(function init(){
  var r=document.documentElement.style;
  r.setProperty('--primary', S.theme.primary); r.setProperty('--primary-dark', S.theme.primaryDark); r.setProperty('--accent', S.theme.accent);
  $('logo').src = S.logo; $('logo').alt = S.name.en;
  st.ui = detectLang(); st.plat = S.defaultPlatform || 'tripadvisor';
  var d = loadDraft();
  renderStatic();
  if (d && d.body){ $('body').value = d.body; $('title2').value = st.title; updateMeter(); }
  go(1);
})();
</script>
