<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ゲーム＆診断 – くるくるわんこ</title>
<meta name="robots" content="noindex">
<style>
:root{--or:#F26A1B;--ord:#C2410C;--ink:#3A2A1E;--cream:#FFF6EA;--mute:#7A6656}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--cream) radial-gradient(circle at 10px 10px,rgba(242,106,27,.10) 7px,transparent 8px) 0 0/72px 72px;color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",-apple-system,sans-serif;padding:20px 16px 32px}
.wrap{max-width:440px;margin:0 auto}
h1{margin:6px 0 4px;text-align:center;font-size:26px;font-weight:800;color:var(--ord)}
.sub{text-align:center;font-size:14px;color:var(--mute);margin:0 0 18px}
a.card{display:flex;align-items:center;gap:14px;background:#fff;border:4px solid var(--or);border-radius:24px;padding:16px;margin:0 0 16px;text-decoration:none;color:var(--ink);box-shadow:0 6px 0 rgba(194,65,12,.25)}
a.card:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(194,65,12,.25)}
a.card img{width:96px;height:96px;object-fit:contain;flex:none}
a.card b{display:block;font-size:22px;font-weight:800;margin-bottom:4px}
a.card span{display:block;font-size:14px;line-height:1.6;color:var(--mute)}
.go{margin-left:auto;flex:none;width:36px;height:36px;border-radius:50%;background:var(--or);color:#fff;font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center}
.note{font-size:12px;color:var(--mute);text-align:center;line-height:1.7;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>ゲーム＆診断</h1>
  <p class="sub">待ち時間に、どっちで遊ぶ？</p>
  <a class="card" id="game" href="https://liff.line.me/2009029356-p3490y5B">
    <img src="d07.png" alt="">
    <div><b>🎮 ミニゲーム</b><span>わんこそばのゲームが21種類。遊ぶとポイントがたまって、特典と交換できます。</span></div>
    <div class="go">›</div>
  </a>
  <a class="card" id="quiz" href="https://liff.line.me/2010374738-pfh4Szc5?quiz=1">
    <img src="d11.png" alt="">
    <div><b>🥢 わんこそば診断</b><span>ジョークのお楽しみ診断と、何杯食べられるか予想する本格診断（100問）。</span></div>
    <div class="go">›</div>
  </a>
  <p class="note" id="note">ミニゲームのポイントと診断の結果は、このLINEに残ります。</p>
</div>
<script>
// 11/08 ごろうさん：LINEの中（リッチメニュー）ならLINE版へ。QRからふつうのブラウザで開いたら、LINEなしで遊べる方へ（あとでLINEに引き継げる）
(function () {
  if (/ Line\//i.test(navigator.userAgent)) return;
  document.getElementById('game').href = 'https://wankoshinjuku.github.io/wanko-guide/minigame/';
  document.getElementById('quiz').href = 'https://kurukuru-mypage.vercel.app/shindan?start=1';
  document.getElementById('note').textContent = 'LINEの登録はいりません。あとで公式LINEに登録すると、ポイントや診断の結果をLINEに引き継げます。';
})();
</script>
</body>
</html>
