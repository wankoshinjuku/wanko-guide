<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>くるくるわんこ 注意事項｜Kurukuru Wanko Precautions</title>
<meta name="description" content="回転わんこそば くるくるわんこ ご利用前の注意事項（日本語・English・中文・한국어）">
<style>
  :root{
    --orange:#E8842B;
    --orange-dark:#C96A14;
    --brown:#4A3120;
    --cream:#FFF7EE;
    --card:#FFFFFF;
    --text:#3A2A1B;
    --muted:#7A6552;
    --line:#F0E2D2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","PingFang SC","Apple SD Gothic Neo","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--cream);
    color:var(--text);
    line-height:1.75;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 16px 56px;}
  header{padding:28px 0 8px;text-align:center;}
  .brand{font-size:14px;font-weight:700;color:var(--orange-dark);letter-spacing:.5px;}
  h1{font-size:22px;font-weight:800;color:var(--brown);margin:6px 0 4px;line-height:1.4;}
  .updated{font-size:12px;color:var(--muted);}
  .langs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0 6px;position:sticky;top:0;background:var(--cream);padding:10px 0;z-index:2;}
  .langs button{
    font:inherit;font-size:14px;font-weight:700;border:2px solid var(--orange);
    background:var(--card);color:var(--orange-dark);border-radius:999px;padding:6px 14px;cursor:pointer;
  }
  .langs button[aria-pressed="true"]{background:var(--orange);color:#fff;}
  section.card{background:var(--card);border-radius:14px;padding:16px 18px;margin:14px 0;box-shadow:0 1px 0 var(--line);}
  h2{font-size:17px;color:var(--orange-dark);margin:0 0 8px;}
  ul{margin:0;padding-left:1.2em;}
  li{margin:4px 0;}
  .note{font-weight:700;color:var(--brown);text-align:center;margin:20px 0 0;}
  a.form{display:inline-block;margin-top:8px;font-weight:700;color:#fff;background:var(--orange);border-radius:10px;padding:8px 14px;text-decoration:none;word-break:break-all;}
  footer{text-align:center;font-size:12px;color:var(--muted);margin-top:28px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">回転わんこそば くるくるわんこ ／ Kurukuru Wanko</div>
    <h1 id="title"></h1>
    <div class="updated" id="updated"></div>
  </header>
  <nav class="langs" aria-label="Language">
    <button data-l="ja">日本語</button>
    <button data-l="en">English</button>
    <button data-l="zh">中文</button>
    <button data-l="ko">한국어</button>
  </nav>
  <main id="content"></main>
  <footer>© Kurukuru Wanko</footer>
</div>
<script>
const FORM = "https://docs.google.com/forms/d/e/1FAIpQLSeRNBd5KtU98JTaJ3UbEzWmTGObVRiVHNCrSSKp2mfIKXTNCw/viewform";
const D = {
ja:{title:"ご利用前に必ずお読みください",updated:"最終更新：2026年10月13日",formLabel:"アカウント審査確認フォーム",
 sec:[
 ["ご参加いただけない方",["体調の悪い方","そばアレルギーのある方（疑いのある方を含みます）","深酒・泥酔など、お酒に酔われていると当店スタッフが判断した方","未就学のお子様のみでのご参加"]],
 ["安全にお楽しみいただくために",["わんこそばは短い時間にたくさん食べるため、誤嚥（ごえん）・窒息・嘔吐・消化不良などのおそれがあります。速く食べるほど、このおそれは高くなります。","食べる量やスピードは、ご自身の体調に合わせてご自身で判断してください。苦しい、気分が悪いなど異変を感じたら、すぐに食べるのをやめてスタッフにお知らせください。","妊娠中の方、飲み込みに不安のある方、医師から食事を制限されている方は、ご自身の判断と責任でご参加ください。","お客様に異変が見られる場合、当店の判断で救急車を呼ぶことがあります。","当店の故意または過失による場合を除き、お客様ご自身の体調や食べ方が原因の事故・体調不良について、当店は責任を負いかねます。"]],
 ["お子様のご参加",["小学生以上の方は、大人と同じ料金でご参加いただけます。","未就学のお子様は、保護者の方とご一緒の場合に限り、無料でご参加いただけます（保護者の方のお席を一緒にお使いいただきます）。","お子様は特に喉に詰まらせやすいため、保護者の方がそばで見守り、保護者の方の責任のもとでご参加ください。"]],
 ["ルール・料金",["当店は立ち食いスタイルです。わんこそば開始後に座ったり、お手洗いに行かれたりした時点で終了となります。","体調不良、ルール違反、他のお客様へのご迷惑となる行為、スタッフの指示に従っていただけない場合は、当店の判断でわんこそばの提供を中止します。","わんこそば開始後に終了・中止となった場合、料金の返金はございません。","店内（お手洗いを含む）で嘔吐された場合、清掃料として1万円を申し受けます。ご自身で清掃された場合は減免することがあります。"]],
 ["撮影・配信",["店内が狭いため、撮影・配信をしている方がいる場合、他のお客様が映像に映り込んだり、声が入ったりすることを避けられません。あらかじめご了承のうえご来店ください。","店内および当店入口付近での生配信は、事前のアカウント審査で承認された方のみできます（お連れ様も同様です）。承認のない配信は止めていただき、応じていただけない場合はご退店をお願いします。","当店および従業員の名誉・信用を損なうおそれのある動画・配信は、非公開・削除をお願いすることがあります（判断基準はお答えできません）。"]],
 ["配信（生配信）をご希望の方へ",["店内および当店入口付近で配信するには、事前に下記フォームからアカウントの審査確認を受けていただく必要があります（お連れ様が配信する場合も同様です）。","審査確認がお済みでない方、ご来店時までに審査が完了していない方、審査の結果「配信不可」となった方は、配信できません。","審査の結果はメールでお知らせします（2〜3日かかる場合があります）。余裕をもってお申し込みください。","配信に関するその他の注意事項は、フォーム内に記載しています。"],true]
 ],note:"※ 上記にご同意いただけない場合は、ご参加いただけません。"},
en:{title:"Please read before taking part",updated:"Last updated: October 13, 2026",formLabel:"Account Verification Form",
 sec:[
 ["Who cannot take part",["Anyone who is feeling unwell","Anyone with a soba (buckwheat) allergy, including anyone who may have one","Anyone our staff judge to be intoxicated (for example, heavily drunk)","Preschool children on their own (without a parent or guardian)"]],
 ["For your safety and enjoyment",["Because wanko soba involves eating a lot in a short time, there is a risk of choking, food going down the wrong way (aspiration), vomiting and indigestion. The faster you eat, the higher this risk becomes.","Please decide how much and how fast to eat yourself, according to your own physical condition. If you feel anything unusual, such as difficulty breathing or nausea, stop eating immediately and tell a staff member.","If you are pregnant, have difficulty swallowing, or have dietary restrictions from a doctor, please take part at your own discretion and responsibility.","If a customer appears unwell, we may call an ambulance at our discretion.","Except where caused by our intentional act or negligence, we are not responsible for any accident or illness caused by your own physical condition or the way you eat."]],
 ["Children",["Children of elementary school age and older can take part for the same price as adults.","Preschool children can take part free of charge only together with a parent or guardian (sharing the parent's or guardian's seat).","Children are especially likely to choke, so a parent or guardian must stay close and watch them. Children take part under the parent's or guardian's responsibility."]],
 ["Rules and fees",["This is a standing-style restaurant. Once wanko soba has started, it ends if you sit down or go to the restroom.","We will stop serving wanko soba at our discretion if you are unwell, break the rules, disturb other customers, or do not follow staff instructions.","If wanko soba ends or is stopped after it has started, no refund will be given.","If you vomit inside the restaurant (including the restroom), a cleaning fee of ¥10,000 will be charged. This may be reduced if you clean up yourself."]],
 ["Filming and live streaming",["Because the restaurant is small, if someone is filming or streaming, other customers cannot avoid appearing in the video or having their voice recorded. Please understand this before visiting.","Live streaming in the restaurant and near the entrance is only allowed for accounts approved in advance through our account review (this also applies to anyone with you). If you stream without approval, we will ask you to stop; if you do not, we will ask you to leave.","We may ask you to make private or delete any video or stream that may damage the reputation or credibility of our restaurant or staff (we cannot answer questions about our criteria)."]],
 ["For guests who wish to live stream",["To stream in the restaurant or near the entrance, you must complete account verification in advance using the form below (this also applies to anyone with you who wishes to stream).","You cannot stream if you have not completed verification, if your review has not been completed by the time of your visit, or if your account was not approved.","We will notify you of the result by email (this may take 2–3 days). Please apply well in advance.","Other streaming rules are listed in the form."],true]
 ],note:"※ If you do not agree to the above, you cannot take part."},
zh:{title:"使用前请务必阅读",updated:"最后更新：2026年10月13日",formLabel:"账号审核表",
 sec:[
 ["不能参加的顾客",["身体不适的顾客","对荞麦过敏的顾客（包括疑似过敏者）","经本店工作人员判断处于醉酒状态（如饮酒过量、烂醉）的顾客","仅有学龄前儿童参加（无监护人陪同）"]],
 ["为了您能安全享用",["碗子荞麦面需要在短时间内大量进食，存在误咽、窒息、呕吐、消化不良等风险。吃得越快，风险越高。","进食的量和速度，请根据自身身体状况自行判断。如感到呼吸困难、身体不适等异常，请立即停止进食并告知工作人员。","孕妇、吞咽有困难的顾客、受医生饮食限制的顾客，请自行判断并自行承担责任参加。","如发现顾客出现异常，本店可能会自行判断呼叫救护车。","除因本店故意或过失造成的情况外，对于因顾客自身身体状况或进食方式引起的事故或身体不适，本店概不负责。"]],
 ["儿童参加",["小学生及以上的顾客，按成人相同收费参加。","学龄前儿童仅在与监护人一同参加时可免费参加（与监护人共用座位）。","儿童特别容易噎住，请监护人在旁看护，并由监护人承担责任参加。"]],
 ["规则与费用",["本店为站立式用餐。碗子荞麦面开始后，如坐下或前往洗手间，即告结束。","如出现身体不适、违反规则、打扰其他顾客或不听从工作人员指示的情况，本店将自行判断停止提供碗子荞麦面。","碗子荞麦面开始后结束或中止的，恕不退款。","如在店内（包括洗手间）呕吐，将收取清洁费1万日元。如顾客自行清理，清洁费可予以减免。"]],
 ["拍摄与直播",["由于店内空间狭小，如有人在拍摄或直播，其他顾客无法避免出现在画面中或声音被录入。请在知悉此情况后光临。","店内及本店入口附近的直播，仅限事先通过账号审核的顾客（同行者亦同）。未经批准的直播，我们会请您停止；如不配合，将请您离店。","对于可能损害本店及员工名誉与信誉的视频或直播，我们可能会请您设为非公开或删除（恕不说明判断标准）。"]],
 ["希望直播的顾客",["如需在店内及本店入口附近直播，须事先通过下方表格完成账号审核（同行者直播亦同）。","未完成审核、来店时审核尚未结束，或审核结果为「不可直播」的顾客，无法直播。","审核结果将通过电子邮件通知（可能需要2〜3天），请尽早申请。","其他直播相关注意事项记载于表格中。"],true]
 ],note:"※ 如不同意上述内容，则无法参加。"},
ko:{title:"이용 전에 반드시 읽어 주십시오",updated:"최종 업데이트: 2026년 10월 13일",formLabel:"계정 심사 신청서",
 sec:[
 ["참가하실 수 없는 분",["몸 상태가 좋지 않은 분","메밀 알레르기가 있는 분(의심되는 분 포함)","과음·만취 등 술에 취했다고 저희 직원이 판단한 분","미취학 어린이만의 참가(보호자 미동반)"]],
 ["안전하게 즐기시기 위해",["완코소바는 짧은 시간에 많이 먹기 때문에 오연(음식이 기도로 넘어감)·질식·구토·소화불량 등의 위험이 있습니다. 빨리 먹을수록 이 위험은 높아집니다.","먹는 양과 속도는 본인의 몸 상태에 맞춰 스스로 판단해 주십시오. 숨이 막히거나 속이 안 좋은 등 이상을 느끼시면 즉시 드시는 것을 멈추고 직원에게 알려 주십시오.","임신 중인 분, 삼키는 데 불안이 있는 분, 의사로부터 식사 제한을 받고 있는 분은 본인의 판단과 책임하에 참가해 주십시오.","고객에게 이상이 보일 경우, 저희 가게의 판단으로 구급차를 부를 수 있습니다.","저희 가게의 고의 또는 과실에 의한 경우를 제외하고, 고객 본인의 몸 상태나 먹는 방식이 원인인 사고·건강 이상에 대해서는 책임을 지지 않습니다."]],
 ["어린이의 참가",["초등학생 이상은 성인과 같은 요금으로 참가하실 수 있습니다.","미취학 어린이는 보호자와 함께하는 경우에 한해 무료로 참가하실 수 있습니다(보호자의 자리를 함께 사용).","어린이는 특히 목에 걸리기 쉬우므로, 보호자가 곁에서 지켜보며 보호자의 책임하에 참가해 주십시오."]],
 ["규칙·요금",["저희 가게는 서서 먹는 스타일입니다. 완코소바 시작 후 자리에 앉거나 화장실에 가시면 그 시점에서 종료됩니다.","몸 상태 불량, 규칙 위반, 다른 고객에게 폐가 되는 행위, 직원의 지시에 따르지 않는 경우에는 저희 가게의 판단으로 완코소바 제공을 중단합니다.","완코소바 시작 후 종료·중단된 경우 요금은 환불되지 않습니다.","매장 내(화장실 포함)에서 구토하신 경우 청소비로 1만 엔을 청구합니다. 직접 청소하신 경우 감면할 수 있습니다."]],
 ["촬영·방송",["매장이 좁기 때문에 촬영·방송을 하는 분이 있는 경우, 다른 고객이 영상에 찍히거나 목소리가 들어가는 것을 피할 수 없습니다. 미리 양해하신 후 방문해 주십시오.","매장 내 및 매장 입구 부근에서의 라이브 방송은 사전 계정 심사에서 승인된 분만 가능합니다(동행하신 분도 동일). 승인되지 않은 방송은 중지를 요청드리며, 응하지 않으실 경우 퇴장을 부탁드립니다.","저희 가게 및 직원의 명예·신용을 훼손할 우려가 있는 동영상·방송은 비공개·삭제를 요청드릴 수 있습니다(판단 기준은 답변드릴 수 없습니다)."]],
 ["라이브 방송을 희망하시는 분께",["매장 내 및 매장 입구 부근에서 방송하시려면 사전에 아래 신청서로 계정 심사를 받으셔야 합니다(동행하신 분이 방송하시는 경우도 동일).","심사를 받지 않으신 분, 방문 시까지 심사가 완료되지 않은 분, 심사 결과 '방송 불가'가 된 분은 방송하실 수 없습니다.","심사 결과는 이메일로 알려 드립니다(2~3일 걸릴 수 있습니다). 여유를 두고 신청해 주십시오.","방송에 관한 기타 주의사항은 신청서에 기재되어 있습니다."],true]
 ],note:"※ 위 내용에 동의하지 않으시는 경우 참가하실 수 없습니다."}
};
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function render(l){
  const d=D[l]; document.documentElement.lang=l==="zh"?"zh-CN":l;
  document.getElementById("title").textContent=d.title;
  document.getElementById("updated").textContent=d.updated;
  document.getElementById("content").innerHTML=d.sec.map(([h,items,form])=>
    `<section class="card"><h2>■ ${esc(h)}</h2><ul>${items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`+
    (form?`<a class="form" href="${FORM}" target="_blank" rel="noopener">▶ ${esc(d.formLabel)}</a>`:"")+`</section>`
  ).join("")+`<p class="note">${esc(d.note)}</p>`;
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
  try{localStorage.setItem("wankoRulesLang",l);}catch(e){}
  if(history.replaceState) history.replaceState(null,"","#"+l);
}
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>render(b.dataset.l));
let start=(location.hash||"").slice(1);
if(!D[start]){try{start=localStorage.getItem("wankoRulesLang");}catch(e){}}
if(!D[start]){const n=(navigator.language||"ja").toLowerCase(); start=n.startsWith("ja")?"ja":n.startsWith("zh")?"zh":n.startsWith("ko")?"ko":"en";}
render(start);
</script>
</body>
</html>
